app:
  name: ai-loop-project
  version: "0.1.0"
  environment: development

providers:
  default: omniroute
  # Longer articles need more time per attempt. Safe because doOnce now
  # clamps each attempt to the remaining parent deadline (chi 180s envelope).
  timeout_seconds: 90
  max_retries: 3
  list:
    - name: omniroute
      # NOTE: OMNI_ROUTE_URL env var overrides this at runtime (I4).
      # Current runtime resolves to http://localhost:20128 (Podman container).
      base_url: https://api.omniroute.ai/v1
      free_tier: true
      rate_limit_rpm: 20
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      free_tier: true
      # Free models cap at 20 req/min (NOT 50) — G1.2 respect rate limits.
      rate_limit_rpm: 20

routing:
  strategy: fallback
  fallback_chain:
    - omniroute      # gateway: provider-level fallback happens INSIDE OmniRoute
    - openrouter     # real second gateway: own key + own model + chat shape
  timeout_seconds: 60
  max_requests_retries: 5

budget:
  daily_limit_usd: 0.0
  max_requests_per_minute: 20
  cost_per_1k_input_tokens: 0.0
  cost_per_1k_output_tokens: 0.0
  backoff_base_seconds: 2

logging:
  level: info
  file: data/logs/ai_loop.log
  max_size_mb: 10
  max_backups: 5
  json: true

paths:
  memory_dir: data/memory
  outputs_dir: data/outputs
  logs_dir: data/logs
  cache_dir: data/cache
  pipelines_dir: config/pipelines

scheduler:
  enabled: false      # keep OFF until 17e quality validated (17e-p4 enables it)
  timezone: America/Sao_Paulo
  max_concurrent_pipelines: 1
  lock_stale_seconds: 3600

pipeline:
  require_review: true
  max_iterations: 50
  dead_loop_failures: 3

server:
  host: 127.0.0.1
  port: 8080