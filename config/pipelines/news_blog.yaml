# Pipeline: news_blog
# Loop: planejar → executar → revisar → publicar
name: news_blog
description: Coleta notícias de IA, gera resumo comentado e publica no blog.

schedule:
  enabled: false
  cron: "0 8 * * *" # diariamente às 08:00 (timezone de settings.scheduler)

model:
  preferred: omniroute/llama-3.8b-instruct
  fallbacks:
    - openrouter/meta-llama/llama-3.1-8b-instruct:free
  max_tokens: 2048
  temperature: 0.4

stages:
  - id: plan
    action: generate
    prompt_file: internal/pipeline/templates/news_blog_plan.md
    output_key: plan

  - id: execute
    action: generate
    depends_on: [plan]
    prompt_file: internal/pipeline/templates/news_blog_draft.md
    input_keys: [plan]
    output_key: draft

  - id: review
    action: self_review
    depends_on: [execute]
    criteria:
      - factual_sources_cited
      - no_prompt_leak
      - length_within_budget
    output_key: reviewed

  - id: publish
    action: http_post
    endpoint_env: AILOOP_BLOG_WEBHOOK # segredo via env (GUARDRAILS G2.1)
    depends_on: [review]
    input_keys: [reviewed]

limits:
  require_review: true # nunca publicar sem aprovação humana (G3.2)
  max_cost_per_run_usd: 0.0 # somente tier gratuito (G1)
  max_retries_per_stage: 3
  dead_loop_failures: 3

cache:
  enabled: true
  ttl_minutes: 240
  dir: data/cache

memory:
  enabled: true
  store_outputs: true
  compress_after_runs: 10
